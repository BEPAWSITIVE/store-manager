{% extends "base.html" %}

{% block content %}
<div class="flex-1 min-h-0 flex flex-col justify-center px-4 sm:px-6 py-8 bg-slate-50 overflow-y-auto">

  <div class="w-full max-w-sm mx-auto space-y-5">

    <!-- Store Branding Header -->
    <div class="text-center space-y-1.5 pb-1">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#2563eb] to-blue-500 text-white flex items-center justify-center mx-auto shadow-xl shadow-blue-500/25">
        <i data-lucide="store" class="w-7 h-7 stroke-[2.2]"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight">Store Portal Login</h2>
      <p class="text-xs text-slate-500 font-medium">Enter your credentials to access the store</p>
    </div>

    <!-- Simple Login Form Card -->
    <div class="p-6 rounded-3xl bg-white border border-slate-100 shadow-xl shadow-slate-200/50 space-y-4">

      <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email or Username</label>
          <div class="relative">
            <input type="text" id="loginEmail" required placeholder="Enter email or username" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            <div class="absolute right-3.5 top-2.5 text-slate-400">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            <button type="button" onclick="toggleLoginPassword()" class="absolute right-3.5 top-2.5 text-slate-400 hover:text-slate-600 transition-colors">
              <i data-lucide="eye" id="loginPassEye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="w-full py-3 rounded-xl bg-[#2563eb] hover:bg-blue-700 active:scale-98 text-white font-extrabold text-xs flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/25 transition-all">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>
        </button>
      </form>

    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // If already logged in, redirect to appropriate view
    const userStr = localStorage.getItem("store_auth_user");
    if (userStr) {
      try {
        const user = JSON.parse(userStr);
        if (user && user.role) {
          const isMobile = window.innerWidth < 768;
          if (isMobile) {
            window.location.href = "/scan";
          } else {
            window.location.href = user.role === "billing" ? "/billing" : "/scan";
          }
          return;
        }
      } catch (e) {}
    }
  });

  function toggleLoginPassword() {
    const input = document.getElementById("loginPassword");
    const eye = document.getElementById("loginPassEye");
    if (input.type === "password") {
      input.type = "text";
      if (eye) eye.setAttribute("data-lucide", "eye-off");
    } else {
      input.type = "password";
      if (eye) eye.setAttribute("data-lucide", "eye");
    }
    if (window.lucide) lucide.createIcons();
  }

  async function submitLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
      showToast("Please enter email and password", "warning");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `
        <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <span>Authenticating...</span>
      `;
    }

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem("store_auth_user", JSON.stringify(data.user));
        showToast(data.message || "Login successful!", "success");
        setTimeout(() => {
          const isMobile = window.innerWidth < 768;
          if (isMobile) {
            window.location.href = "/scan";
          } else {
            window.location.href = data.redirect_url || (data.user.role === "billing" ? "/billing" : "/scan");
          }
        }, 350);
      } else {
        showToast(data.detail || "Authentication failed", "error");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>`;
          if (window.lucide) lucide.createIcons();
        }
      }
    } catch (err) {
      showToast("Network error logging in", "error");
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>`;
        if (window.lucide) lucide.createIcons();
      }
    }
  }
</script>
{% endblock %}
