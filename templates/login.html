{% extends "base.html" %}

{% block content %}
<div class="flex-1 min-h-0 flex flex-col justify-center px-5 py-6 bg-slate-50 overflow-y-auto">

  <div class="w-full max-w-sm mx-auto space-y-4">

    <!-- Store Branding Header -->
    <div class="text-center space-y-1 pb-1">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#2563eb] to-blue-400 text-white flex items-center justify-center mx-auto shadow-xl shadow-blue-500/25">
        <i data-lucide="store" class="w-7 h-7 stroke-[2.2]"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight">Store Portal Login</h2>
      <p class="text-xs text-slate-500 font-medium">Scan Stock or POS Billing • Powered by Supabase</p>
    </div>

    <!-- Login Form Card -->
    <div class="p-5 rounded-3xl bg-white border border-slate-100 shadow-xl space-y-4">

      <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();" class="space-y-3.5">
        <div>
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Email or Username</label>
          <div class="relative">
            <input type="text" id="loginEmail" required placeholder="manager@store.com or cashier@store.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            <div class="absolute right-3 top-2.5 text-slate-400">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            <button type="button" onclick="toggleLoginPassword()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" id="loginPassEye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="w-full py-3 rounded-xl bg-[#2563eb] hover:bg-blue-700 active:scale-98 text-white font-extrabold text-xs flex items-center justify-center space-x-2 shadow-lg shadow-blue-500/25 transition-all">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>
        </button>
      </form>

      <!-- Role-Separated 1-Click Quick Logins -->
      <div class="pt-2 border-t border-slate-100 space-y-2">
        <div class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider text-center">
          1-Click Staff Demo Accounts
        </div>

        <div class="grid grid-cols-2 gap-2">
          <!-- Store Manager Button -->
          <button type="button" onclick="quickLogin('manager@store.com', 'manager123')" class="p-2.5 rounded-2xl bg-blue-50/80 hover:bg-blue-100/90 active:scale-95 border border-blue-100 text-left transition-all">
            <div class="flex items-center space-x-1.5 text-blue-700 font-extrabold text-xs mb-0.5">
              <i data-lucide="scan" class="w-3.5 h-3.5"></i>
              <span>Store Manager</span>
            </div>
            <p class="text-[10px] text-blue-900/70 font-medium">Scan & Stock</p>
          </button>

          <!-- Cashier / Billing Staff Button -->
          <button type="button" onclick="quickLogin('cashier@store.com', 'billing123')" class="p-2.5 rounded-2xl bg-emerald-50/80 hover:bg-emerald-100/90 active:scale-95 border border-emerald-100 text-left transition-all">
            <div class="flex items-center space-x-1.5 text-emerald-700 font-extrabold text-xs mb-0.5">
              <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
              <span>Billing Staff</span>
            </div>
            <p class="text-[10px] text-emerald-900/70 font-medium">POS Billing</p>
          </button>
        </div>
      </div>

    </div>

    <!-- Supabase Connection Status Banner -->
    <div class="p-3.5 rounded-2xl bg-white border border-slate-100 shadow-sm flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2">
        <span id="sbStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <div>
          <span class="font-extrabold text-slate-900">Supabase Cloud:</span>
          <span id="sbStatusText" class="text-slate-500 font-medium ml-1">Checking...</span>
        </div>
      </div>
      <button type="button" onclick="openSettingsModal()" class="text-[#2563eb] font-bold text-xs hover:underline flex items-center space-x-1">
        <i data-lucide="settings" class="w-3.5 h-3.5"></i>
        <span>Configure</span>
      </button>
    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Check if already logged in
    const userStr = localStorage.getItem("store_auth_user");
    if (userStr) {
      try {
        const user = JSON.parse(userStr);
        if (user && user.role) {
          if (user.role === "billing") window.location.href = "/billing";
          else window.location.href = "/scan";
          return;
        }
      } catch (e) {}
    }

    checkSupabaseStatus();
  });

  async function checkSupabaseStatus() {
    try {
      const res = await fetch("/api/auth/status");
      const data = await res.json();
      const dot = document.getElementById("sbStatusDot");
      const text = document.getElementById("sbStatusText");
      if (data.supabase_configured) {
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
        if (text) text.innerText = "Connected";
      } else {
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
        if (text) text.innerText = "Demo / Local mode";
      }
    } catch (e) {}
  }

  function toggleLoginPassword() {
    const input = document.getElementById("loginPassword");
    const eye = document.getElementById("loginPassEye");
    if (input.type === "password") {
      input.type = "text";
      if (eye) eye.setAttribute("data-lucide", "eye-off");
    } else {
      input.type = "password";
      if (eye) eye.setAttribute("data-lucide", "eye");
    }
    if (window.lucide) lucide.createIcons();
  }

  async function submitLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
      showToast("Please enter email and password", "warning");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `
        <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <span>Authenticating...</span>
      `;
    }

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem("store_auth_user", JSON.stringify(data.user));
        showToast(data.message || "Login successful!", "success");
        setTimeout(() => {
          window.location.href = data.redirect_url || (data.user.role === "billing" ? "/billing" : "/scan");
        }, 350);
      } else {
        showToast(data.detail || "Authentication failed", "error");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>`;
          if (window.lucide) lucide.createIcons();
        }
      }
    } catch (err) {
      showToast("Network error logging in", "error");
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>`;
        if (window.lucide) lucide.createIcons();
      }
    }
  }

  function quickLogin(email, password) {
    document.getElementById("loginEmail").value = email;
    document.getElementById("loginPassword").value = password;
    submitLogin();
  }
</script>
{% endblock %}
